version: 2

models:

  - name: stg_farm_yield
    description: "Cleaned, type-cast staging view over raw.farm_yield"
    columns:
      - name: farm_id
        tests: [not_null]
      - name: yield_tons
        tests: [not_null]

  - name: dim_farm
    description: "Farm dimension — one row per distinct Farm_ID"
    columns:
      - name: farm_key
        description: "Surrogate key"
        tests: [unique, not_null]
      - name: farm_id
        description: "Natural key from source"
        tests: [unique, not_null]

  - name: dim_crop
    description: "Crop dimension — one row per (crop_type, harvest_season)"
    columns:
      - name: crop_key
        tests: [unique, not_null]
      - name: crop_type
        tests: [not_null]
      - name: harvest_season
        tests: [not_null]

  - name: dim_region
    columns:
      - name: region_key
        tests: [unique, not_null]
      - name: region_name
        tests: [unique, not_null]

  - name: dim_soil
    columns:
      - name: soil_key
        tests: [unique, not_null]
      - name: soil_type
        tests: [unique, not_null]

  - name: dim_irrigation
    columns:
      - name: irrigation_key
        tests: [unique, not_null]
      - name: irrigation_type
        tests: [unique, not_null]

  - name: fact_farm_yield
    description: "Fact table — one row per farm × crop × region × soil × irrigation observation"
    columns:
      - name: farm_key
        tests:
          - not_null
          - relationships: { to: ref('dim_farm'), field: farm_key }
      - name: crop_key
        tests:
          - not_null
          - relationships: { to: ref('dim_crop'), field: crop_key }
      - name: region_key
        tests:
          - not_null
          - relationships: { to: ref('dim_region'), field: region_key }
      - name: soil_key
        tests:
          - not_null
          - relationships: { to: ref('dim_soil'), field: soil_key }
      - name: irrigation_key
        tests:
          - not_null
          - relationships: { to: ref('dim_irrigation'), field: irrigation_key }
      - name: yield_tons
        tests: [not_null]
